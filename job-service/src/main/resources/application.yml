spring:
  application:
    name: job
  datasource:
    url: jdbc:mysql://localhost:3306/job_db
    username: root
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: none

server:
  port: 8082

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
    healthcheck:
      enabled: true
  instance:
    prefer-ip-address: true


management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: job
    version: 1.0.0
    description: Microservice de gestion des offres d'emploi





